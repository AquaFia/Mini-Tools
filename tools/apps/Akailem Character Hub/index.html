<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Akailem Character Hub">
  <title>Akailem Character Hub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-copy"><strong>Akailem</strong><small>Character Hub</small></div>
      </div>

      <nav aria-label="Main navigation">
        <button class="nav-btn active" type="button"><span class="nav-icon" aria-hidden="true">🏠</span><span class="nav-label">Dashboard</span></button>
        <button class="nav-btn" type="button"><span class="nav-icon" aria-hidden="true">👤</span><span class="nav-label">Characters</span></button>
        <button class="nav-btn" type="button"><span class="nav-icon" aria-hidden="true">👥</span><span class="nav-label">Groups</span></button>
        <button class="nav-btn" type="button"><span class="nav-icon" aria-hidden="true">🕸</span><span class="nav-label">Relationships</span></button>
        <button class="nav-btn" type="button"><span class="nav-icon" aria-hidden="true">📖</span><span class="nav-label">Events</span></button>
        <button class="nav-btn" type="button"><span class="nav-icon" aria-hidden="true">🖼</span><span class="nav-label">Gallery</span></button>
        <button class="nav-btn" type="button"><span class="nav-icon" aria-hidden="true">📊</span><span class="nav-label">Statistics</span></button>
        <button class="nav-btn" type="button"><span class="nav-icon" aria-hidden="true">⚙️</span><span class="nav-label">Settings</span></button>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <input id="globalSearch" type="search" placeholder="🔍 Search names, MBTI, groups, residences…" autocomplete="off">
        <button id="theme" class="icon-btn" type="button" aria-label="Toggle light and dark mode">🌙</button>
      </header>

      <div class="content">
        <section class="page-head">
          <div>
            <span class="kicker">Personal universe encyclopedia</span>
            <h1>Akailem Character Hub</h1>
            <p><span id="apiMode">Connecting to Notion</span> · Last updated: <span id="updatedDate">—</span></p>
          </div>
          <button id="refresh" class="secondary" type="button">🔄 Refresh</button>
        </section>

        <div id="status" class="status" hidden></div>
        <section id="stats" class="grid stats" aria-label="Character statistics"></section>

        <section class="grid dashboard-grid">
          <div class="stack">
            <div class="card panel">
              <div class="panel-heading">
                <h2><span aria-hidden="true">✨</span> Character Spotlight</h2>
                <button id="randomize" class="icon-btn" type="button" aria-label="Choose another character">🎲</button>
              </div>
              <div id="spotlight"></div>
            </div>
          </div>

          <div class="stack">
            <div class="card panel">
              <h2><span aria-hidden="true">🕒</span> Recently Updated</h2>
              <div id="recent" class="list"></div>
            </div>
            <div class="card panel">
              <h2><span aria-hidden="true">🎂</span> Upcoming Birthdays</h2>
              <div id="birthdays" class="list"></div>
            </div>
          </div>
        </section>

        <section class="explorer">
          <div class="explorer-toolbar">
            <div>
              <h2><span aria-hidden="true">🧭</span> Character Explorer</h2>
              <small id="resultCount"></small>
            </div>
            <div class="view-group" aria-label="Character view">
              <button class="view-btn active" data-view="cards" type="button">▦ Cards</button>
              <button class="view-btn" data-view="compact" type="button">☷ Compact</button>
              <button class="view-btn" data-view="table" type="button">▤ Table</button>
            </div>
          </div>

          <div class="filter-layout">
            <aside id="filters" class="card filters" aria-label="Character filters"></aside>
            <div id="characterResults"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <dialog id="profileDialog" class="profile-dialog">
    <button id="closeDialog" class="dialog-close" type="button" aria-label="Close">×</button>
    <div id="profileContent"></div>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
