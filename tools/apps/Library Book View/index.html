<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Memory Library</title>
  <style>
    :root {
      color-scheme: dark;
      --gold: #d8a24a;
      --gold-soft: rgba(216,162,74,.28);
      --panel: rgba(11,8,7,.96);
      --paper: #17110e;
      --text: #f7eee1;
      --muted: #c8b8a5;
      --danger: #ffb4a9;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #090605; color: var(--text); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    button, input { font: inherit; }
    button { color: inherit; }
    .scene { position: relative; width: 100%; min-height: 100vh; overflow: hidden; background: #090605; }
    .scene > img { display: block; width: 100%; height: 100vh; object-fit: contain; object-position: center; user-select: none; -webkit-user-drag: none; }
    .hotspot { position: absolute; top: 23%; height: 55%; border: 2px solid transparent; border-radius: 18px; background: transparent; cursor: pointer; transition: .2s ease; }
    .hotspot-memory { left: 76.5%; width: 20%; }
    .hotspot-books { left: 2.5%; width: 17.5%; }
    .hotspot:hover, .hotspot:focus-visible { outline: none; border-color: rgba(255,206,116,.9); background: rgba(216,162,74,.08); box-shadow: 0 0 0 8px rgba(216,162,74,.08), inset 0 0 45px rgba(216,162,74,.1); }
    .hint { position: absolute; right: 2rem; bottom: 1.4rem; padding: .75rem 1rem; border: 1px solid var(--gold-soft); border-radius: 999px; background: rgba(10,7,6,.74); backdrop-filter: blur(10px); color: #f3d9a7; pointer-events: none; }
    .archive-shell { position: fixed; inset: 0; z-index: 20; display: none; overflow: auto; background:
      radial-gradient(circle at 50% -10%, rgba(255,211,132,.17), transparent 34rem),
      linear-gradient(rgba(9,5,3,.72), rgba(9,5,3,.92)),
      repeating-linear-gradient(90deg, #2b160d 0 7px, #341b10 7px 14px, #25120b 14px 20px);
      color: var(--text); }
    .archive-shell.open { display: block; animation: archiveIn .28s ease both; }
    @keyframes archiveIn { from { opacity: 0; transform: scale(1.015); } to { opacity: 1; transform: scale(1); } }
    .archive-inner { width: min(1500px, 100%); min-height: 100vh; margin: auto; padding: clamp(.8rem, 2vw, 1.8rem); }
    .archive-head { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 1rem; padding: .75rem; border: 1px solid rgba(216,162,74,.25); border-radius: 14px; background: rgba(18,10,6,.9); box-shadow: 0 10px 30px rgba(0,0,0,.32); backdrop-filter: blur(12px); }
    .archive-title { margin: 0; text-align: center; font-family: Georgia, serif; letter-spacing: .17em; font-size: clamp(1.05rem, 2.5vw, 1.65rem); color: #f1d69d; text-transform: uppercase; }
    .archive-actions { display: flex; gap: .55rem; }
    .icon-btn, .primary { border: 1px solid var(--gold-soft); background: rgba(216,162,74,.08); border-radius: 10px; padding: .65rem .85rem; cursor: pointer; }
    .icon-btn:hover, .primary:hover { background: rgba(216,162,74,.16); }
    .archive-tools { display: grid; grid-template-columns: minmax(220px, 1fr) auto; gap: .9rem; align-items: start; padding: 1.15rem 0 .35rem; }
    .search-wrap { display: grid; gap: .65rem; }
    .archive-tools input[type="search"] { width: 100%; border: 1px solid rgba(216,162,74,.35); border-radius: 999px; padding: .82rem 1rem; color: var(--text); background: rgba(13,8,5,.8); box-shadow: inset 0 1px 8px rgba(0,0,0,.45); }
    .filter-bar { display: flex; flex-wrap: wrap; gap: .65rem; align-items: center; }
    .filter-group { position: relative; }
    .filter-toggle { min-width: 145px; display: flex; align-items: center; justify-content: space-between; gap: .8rem; border: 1px solid rgba(216,162,74,.35); border-radius: 10px; padding: .7rem .85rem; background: rgba(13,8,5,.88); cursor: pointer; }
    .filter-toggle[aria-expanded="true"] { background: rgba(216,162,74,.15); }
    .filter-popover { position: absolute; top: calc(100% + .45rem); left: 0; z-index: 12; display: none; min-width: 245px; max-height: min(55vh, 430px); overflow: auto; padding: .6rem; border: 1px solid rgba(216,162,74,.35); border-radius: 12px; background: rgba(15,9,6,.98); box-shadow: 0 18px 45px rgba(0,0,0,.5); }
    .filter-popover.open { display: grid; gap: .2rem; }
    .filter-option { display: flex; align-items: center; gap: .6rem; padding: .5rem .55rem; border-radius: 7px; cursor: pointer; }
    .filter-option:hover { background: rgba(216,162,74,.1); }
    .filter-option input { accent-color: var(--gold); }
    .filter-clear { margin-top: .35rem; border: 1px solid rgba(216,162,74,.25); border-radius: 8px; padding: .5rem .65rem; background: rgba(216,162,74,.07); cursor: pointer; }
    .collection-filters { display: flex; flex-wrap: wrap; gap: .45rem; }
    .collection-btn { border: 1px solid rgba(216,162,74,.3); border-radius: 999px; padding: .58rem .82rem; background: rgba(13,8,5,.78); cursor: pointer; }
    .collection-btn.active { background: linear-gradient(#c79a50, #805022); color: #201006; border-color: #d9ad68; font-weight: 800; }
    .status { color: var(--muted); font-size: .88rem; white-space: nowrap; padding-top: .8rem; }
    .status.error { color: var(--danger); }
    .shelves { display: grid; gap: 1.25rem; padding: .9rem 0 3rem; }
    .shelf-row { position: relative; min-height: 265px; display: flex; align-items: flex-end; gap: clamp(9px, 1.1vw, 16px); padding: 1.25rem clamp(.8rem, 2vw, 1.4rem) 2.15rem; border-left: 10px solid #281108; border-right: 10px solid #281108; background:
      linear-gradient(90deg, rgba(0,0,0,.36), transparent 8%, transparent 92%, rgba(0,0,0,.36)),
      radial-gradient(circle at 50% 0%, rgba(255,214,145,.08), transparent 45%),
      repeating-linear-gradient(90deg, #32190e 0 8px, #3d2113 8px 18px, #2a140b 18px 27px);
      box-shadow: inset 0 16px 32px rgba(0,0,0,.4); overflow: hidden; }
    .shelf-row::after { content: ""; position: absolute; left: -10px; right: -10px; bottom: 0; height: 1.7rem; background: linear-gradient(#704027, #3b1c10 55%, #1c0b06); box-shadow: 0 10px 14px rgba(0,0,0,.58), inset 0 2px rgba(255,226,169,.18); }
    .book-cover { --book-h: 220px; --book-w: 145px; --tilt: 0deg; --book-a: #633027; --book-b: #351613; position: relative; flex: 0 0 var(--book-w); width: var(--book-w); height: var(--book-h); border: 0; padding: 0; color: #ead29a; cursor: pointer; transform: rotate(var(--tilt)); transform-origin: bottom center; border-radius: 5px 8px 4px 4px; background:
      linear-gradient(90deg, rgba(255,255,255,.11), transparent 13%, transparent 86%, rgba(0,0,0,.22)),
      repeating-linear-gradient(0deg, transparent 0 8px, rgba(255,255,255,.025) 8px 9px),
      linear-gradient(135deg, var(--book-a), var(--book-b));
      box-shadow: -5px 8px 10px rgba(0,0,0,.5), inset 1px 0 rgba(255,255,255,.16), inset -3px 0 rgba(0,0,0,.32); transition: transform .18s ease, filter .18s ease, box-shadow .18s ease; z-index: 1; }
    .book-cover::before { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(233,204,132,.68); border-radius: 3px; box-shadow: inset 0 0 0 3px rgba(53,27,10,.22); }
    .book-cover::after { content: ""; position: absolute; left: 18px; right: 18px; top: 20px; bottom: 20px; border-top: 2px solid rgba(233,204,132,.55); border-bottom: 2px solid rgba(233,204,132,.55); pointer-events: none; }
    .book-cover:hover, .book-cover:focus-visible { z-index: 4; outline: none; transform: translateY(-10px) rotate(var(--tilt)) scale(1.025); filter: brightness(1.12); box-shadow: -9px 18px 20px rgba(0,0,0,.62), inset 1px 0 rgba(255,255,255,.2), inset -3px 0 rgba(0,0,0,.32); }
    .book-cover-title.title-compact { letter-spacing: 0; }
    .book-source { position:absolute; left:14px; right:14px; bottom:28px; z-index:2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center; font-size:.68rem; letter-spacing:.04em; color:rgba(243,217,167,.78); text-shadow:0 1px 2px #1b0d08; }
    .collection-book .book-cover-title { inset: 30px 13px 54px; }
    .book-cover-title { position: absolute; inset: 30px 13px; display: flex; align-items: center; justify-content: center; overflow: hidden; text-align: center; font-family: Georgia, serif; font-size: var(--title-size, .9rem); font-weight: 800; line-height: var(--title-line, 1.12); letter-spacing: .012em; text-wrap: balance; overflow-wrap: normal; word-break: normal; hyphens: none; text-shadow: 0 2px 2px rgba(40,19,5,.8); }
    .empty-shelf { width: 100%; align-self: center; text-align: center; color: #bca990; font-style: italic; padding: 2rem; z-index: 2; }


    .reader-shell { position: fixed; inset: 0; z-index: 40; display: none; background: rgba(3,2,2,.78); backdrop-filter: blur(12px); padding: clamp(.4rem, 2vw, 1.5rem); }
    .reader-shell.open { display: grid; place-items: center; }
    .reader { width: min(980px, 100%); height: min(94vh, 1100px); display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--gold-soft); border-radius: 18px; background: var(--paper); box-shadow: 0 30px 90px rgba(0,0,0,.6); }
    .reader-top { display: flex; align-items: center; gap: .7rem; padding: .8rem 1rem; border-bottom: 1px solid var(--gold-soft); background: rgba(8,6,5,.78); }
    .reader-top .spacer { flex: 1; }
    .reader-open-link { color: #f3d9a7; text-decoration: none; }
    .reader-open-link:hover { text-decoration: underline; }
    .reader-scroll { overflow: auto; padding: 0 clamp(1rem, 5vw, 4.5rem) 4rem; }
    .cover { width: calc(100% + clamp(2rem, 10vw, 9rem)); margin-left: calc(-1 * clamp(1rem, 5vw, 4.5rem)); max-height: 310px; object-fit: cover; display: block; }
    .page-head { padding: 2.5rem 0 1.5rem; }
    .page-icon { font-size: 3.5rem; line-height: 1; margin-bottom: .7rem; }
    .page-icon img { width: 64px; height: 64px; object-fit: contain; }
    .page-title { font-family: Georgia, serif; font-size: clamp(2rem, 5vw, 3.5rem); line-height: 1.04; margin: 0; }
    .page-meta { color: var(--muted); margin-top: .8rem; font-size: .9rem; }
    .reader-loading { padding: 5rem 1rem; text-align: center; color: var(--muted); }
    .notion-content { font-family: Georgia, 'Times New Roman', serif; font-size: 1.08rem; line-height: 1.72; }
    .notion-content p { margin: .45rem 0; min-height: 1em; }
    .notion-content h1 { font-size: 2rem; margin: 2rem 0 .6rem; line-height: 1.2; }
    .notion-content h2 { font-size: 1.55rem; margin: 1.7rem 0 .5rem; line-height: 1.25; }
    .notion-content h3 { font-size: 1.25rem; margin: 1.4rem 0 .4rem; line-height: 1.3; }
    .notion-content ul, .notion-content ol { margin: .35rem 0 .7rem; padding-left: 1.7rem; }
    .notion-content li { margin: .18rem 0; }
    .notion-content blockquote { margin: 1rem 0; padding: .2rem 0 .2rem 1rem; border-left: 3px solid var(--gold); color: #eadcc8; }
    .notion-content hr { border: 0; border-top: 1px solid rgba(216,162,74,.28); margin: 1.6rem 0; }
    .rt-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .88em; background: rgba(255,255,255,.08); padding: .1em .28em; border-radius: 4px; }
    .rt-gray, .rt-gray_background { color: #b6aa9d; }
    .rt-red, .rt-red_background { color: #ff9a8f; }
    .rt-orange, .rt-orange_background { color: #ffc07a; }
    .rt-yellow, .rt-yellow_background { color: #f3d985; }
    .rt-green, .rt-green_background { color: #9ed7ae; }
    .rt-blue, .rt-blue_background { color: #9fc9ff; }
    .rt-purple, .rt-purple_background { color: #c9adff; }
    .rt-pink, .rt-pink_background { color: #f3acd5; }
    .callout { display: flex; gap: .8rem; margin: 1rem 0; padding: 1rem; border: 1px solid rgba(216,162,74,.2); border-radius: 10px; background: rgba(255,255,255,.04); }
    .callout-icon { flex: 0 0 auto; }
    .todo { display: flex; align-items: flex-start; gap: .55rem; margin: .35rem 0; }
    .todo input { margin-top: .45rem; pointer-events: none; }
    details { margin: .45rem 0; }
    summary { cursor: pointer; font-weight: 650; }
    pre { overflow: auto; border: 1px solid rgba(216,162,74,.2); border-radius: 10px; background: #0d0a09; padding: 1rem; }
    pre code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9rem; }
    .media { margin: 1.1rem 0; }
    .media img, .media video { display: block; max-width: 100%; max-height: 75vh; margin: auto; border-radius: 8px; }
    .caption { color: var(--muted); text-align: center; font-size: .86rem; margin-top: .4rem; }
    .bookmark { display: block; margin: .8rem 0; padding: .85rem 1rem; border: 1px solid rgba(216,162,74,.24); border-radius: 9px; color: #f3d9a7; text-decoration: none; overflow-wrap: anywhere; }
    .bookmark:hover { background: rgba(216,162,74,.08); }
    .table-wrap { overflow-x: auto; margin: 1rem 0; }
    table { border-collapse: collapse; width: 100%; font-family: Inter, sans-serif; font-size: .92rem; }
    td, th { border: 1px solid rgba(216,162,74,.26); padding: .55rem .65rem; vertical-align: top; }
    .columns { display: flex; gap: 1.3rem; align-items: flex-start; }
    .column { flex: 1 1 0; min-width: 0; }
    .child-page { margin: .5rem 0; padding: .65rem .8rem; border: 1px solid rgba(216,162,74,.18); border-radius: 8px; }
    .book-synopsis { margin: 1rem 0 1.35rem; padding: 1rem 1.1rem; border: 1px solid rgba(123,82,48,.22); border-radius: 10px; background: rgba(117,77,45,.06); color: var(--ink); line-height: 1.65; white-space: pre-wrap; }
    .chapter-list { display:grid; gap:.7rem; margin-top:1.2rem; }
    .chapter-button { width:100%; text-align:left; padding:.8rem .9rem; border:1px solid rgba(216,162,74,.22); border-radius:8px; background:rgba(255,255,255,.025); color:var(--text); cursor:pointer; }
    .chapter-button:hover, .chapter-button:focus-visible { background:rgba(216,162,74,.08); border-color:rgba(216,162,74,.4); }
    .chapter-meta { display:block; margin-top:.25rem; color:var(--muted); font-size:.78rem; }
    .unsupported { color: var(--muted); font-family: Inter, sans-serif; font-size: .85rem; margin: .5rem 0; }
    .truncate-note { margin: 2rem 0; padding: .8rem 1rem; border: 1px solid rgba(255,180,169,.3); border-radius: 9px; color: var(--danger); }
    @media (max-width: 700px) {
      .hint { font-size: .8rem; right: .7rem; bottom: .7rem; }
      .hotspot { top: 20%; height: 58%; }
      .hotspot-memory { left: 70%; width: 28%; }
      .hotspot-books { left: 2%; width: 25%; }
      .archive-inner { padding: .45rem; }
      .archive-head { grid-template-columns: auto 1fr; }
      .archive-actions { display: none; }
      .archive-title { text-align: right; font-size: .92rem; }
      .archive-tools { grid-template-columns: 1fr; padding-inline: .5rem; }
      .status { text-align: center; padding-top: 0; }
      .filter-bar { align-items: stretch; }
      .filter-group, .filter-toggle { width: 100%; }
      .filter-popover { position: fixed; left: .7rem; right: .7rem; top: 9rem; min-width: 0; }
      .collection-filters { width: 100%; }
      .collection-btn { flex: 1 1 auto; }
      .shelf-row { min-height: 235px; padding-inline: .55rem; gap: 8px; }
      .reader-shell { padding: 0; }
      .reader { height: 100vh; border-radius: 0; }
      .reader-top { padding: .65rem; }
      .columns { display: block; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <img src="library.png" alt="A dark library with floor-to-ceiling bookshelves" />
    <button class="hotspot hotspot-books" id="bookCollectionHotspot" aria-label="Open book collection"></button>
    <button class="hotspot hotspot-memory" id="bookshelfHotspot" aria-label="Open memory archive"></button>
    <div class="hint">Left bookshelf: books · Right bookshelf: memories</div>
  </main>

  <section class="archive-shell" id="archiveShell" aria-hidden="true">
    <div class="archive-inner">
      <header class="archive-head">
        <button class="icon-btn" id="closeBtn" type="button">← Library</button>
        <h1 class="archive-title">Memory Archive</h1>
        <div class="archive-actions"><button class="icon-btn" id="refreshBtn" type="button">Refresh</button></div>
      </header>
      <div class="archive-tools">
        <div class="search-wrap">
          <input id="searchInput" type="search" placeholder="Search memory titles…" />
          <div class="filter-bar">
            <div class="filter-group">
              <button class="filter-toggle" id="characterFilterToggle" type="button" aria-expanded="false">Characters <span id="characterFilterCount">All</span></button>
              <div class="filter-popover" id="characterFilterPopover"></div>
            </div>
            <div class="collection-filters" id="collectionFilters">
              <button class="collection-btn active" type="button" data-collection="all">All</button>
              <button class="collection-btn" type="button" data-collection="recent">Recent</button>
              <button class="collection-btn" type="button" data-collection="done">Done</button>
              <button class="collection-btn" type="button" data-collection="draft">Drafts</button>
            </div>
          </div>
        </div>
        <div class="status" id="status">Waiting to load.</div>
      </div>
      <div class="shelves" id="shelves"></div>
    </div>
  </section>

  <section class="archive-shell" id="bookShell" aria-hidden="true">
    <div class="archive-inner">
      <header class="archive-head">
        <button class="icon-btn" id="bookCloseBtn" type="button">← Library</button>
        <h1 class="archive-title">Book Collection</h1>
        <div class="archive-actions"><button class="icon-btn" id="bookRefreshBtn" type="button">Refresh</button></div>
      </header>
      <div class="archive-tools">
        <div class="search-wrap">
          <input id="bookSearchInput" type="search" placeholder="Search book titles…" />
          <div class="filter-bar">
            <div class="collection-filters" id="bookLabelFilters"></div>
          </div>
        </div>
        <div class="status" id="bookStatus">Waiting to load.</div>
      </div>
      <div class="shelves" id="bookShelves"></div>
    </div>
  </section>

  <div class="reader-shell" id="readerShell" aria-hidden="true">
    <article class="reader" role="dialog" aria-modal="true" aria-labelledby="readerTitle">
      <div class="reader-top">
        <button class="icon-btn" id="readerBackBtn" type="button">← Archive</button>
        <div class="spacer"></div>
        <a class="reader-open-link" id="notionLink" href="#" target="_blank" rel="noopener noreferrer">Open in Notion ↗</a>
        <button class="icon-btn" id="readerCloseBtn" type="button" aria-label="Close reader">✕</button>
      </div>
      <div class="reader-scroll" id="readerScroll">
        <div class="reader-loading">Choose a memory from the archive.</div>
      </div>
    </article>
  </div>

  <script src="external_books.js"></script>
  <script>
    const API_ENDPOINT = "https://memory-scenes.aquafia1247.workers.dev/api/memories";
    const BOOKS_API_ENDPOINT = "https://memory-scenes.aquafia1247.workers.dev/api/books";

    const archiveShell = document.getElementById("archiveShell");
    const hotspot = document.getElementById("bookshelfHotspot");
    const bookHotspot = document.getElementById("bookCollectionHotspot");
    const bookShell = document.getElementById("bookShell");
    const bookCloseBtn = document.getElementById("bookCloseBtn");
    const bookRefreshBtn = document.getElementById("bookRefreshBtn");
    const bookSearchInput = document.getElementById("bookSearchInput");
    const bookStatusEl = document.getElementById("bookStatus");
    const bookShelvesEl = document.getElementById("bookShelves");
    const bookLabelFilters = document.getElementById("bookLabelFilters");
    const closeBtn = document.getElementById("closeBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const searchInput = document.getElementById("searchInput");
    const statusEl = document.getElementById("status");
    const shelvesEl = document.getElementById("shelves");
    const characterFilterToggle = document.getElementById("characterFilterToggle");
    const characterFilterPopover = document.getElementById("characterFilterPopover");
    const characterFilterCount = document.getElementById("characterFilterCount");
    const collectionFilters = document.getElementById("collectionFilters");
    const readerShell = document.getElementById("readerShell");
    const readerScroll = document.getElementById("readerScroll");
    const readerCloseBtn = document.getElementById("readerCloseBtn");
    const readerBackBtn = document.getElementById("readerBackBtn");
    const notionLink = document.getElementById("notionLink");

    let memories = [];
    let books = [];
    let booksLoadedOnce = false;
    let loadedOnce = false;
    let activeRequest = 0;
    let activeSeriesBook = null;
    let selectedBookLabel = "all";
    let selectedCharacters = new Set();
    let selectedCollection = "all";

    function openArchive() {
      archiveShell.classList.add("open");
      archiveShell.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      if (!loadedOnce) loadMemories();
    }

    function closeArchive() {
      archiveShell.classList.remove("open");
      archiveShell.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    function openBookCollection() {
      bookShell.classList.add("open");
      bookShell.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      if (!booksLoadedOnce) loadBooks();
    }

    function closeBookCollection() {
      bookShell.classList.remove("open");
      bookShell.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    function openReader() {
      readerShell.classList.add("open");
      readerShell.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeReader() {
      activeRequest += 1;
      readerShell.classList.remove("open");
      readerShell.setAttribute("aria-hidden", "true");
      document.body.style.overflow = (archiveShell.classList.contains("open") || bookShell.classList.contains("open")) ? "hidden" : "";
    }

    function escapeHtml(value = "") {
      return String(value).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[c]);
    }

    function safeUrl(value = "") {
      try {
        const url = new URL(value, window.location.href);
        return ["http:", "https:", "mailto:"].includes(url.protocol) ? url.href : "#";
      } catch { return "#"; }
    }

    function hashString(value = "") {
      let hash = 2166136261;
      for (let i = 0; i < value.length; i++) { hash ^= value.charCodeAt(i); hash = Math.imul(hash, 16777619); }
      return hash >>> 0;
    }

    function stableShuffle(items) {
      return [...items].sort((a, b) => hashString(a.id || a.title) - hashString(b.id || b.title));
    }

    function statusKind(status = "") {
      const value = status.trim().toLowerCase();
      if (["done", "complete", "completed", "finished"].some(x => value.includes(x))) return "done";
      return "draft";
    }

    function bookStyle(memory) {
      const seed = hashString(memory.id || memory.title || "memory");
      const palettes = [["#6b342c","#351713"],["#3d5968","#1c2d37"],["#415a39","#1e2d1b"],["#604c2b","#302414"],["#573b64","#2d1e34"],["#70483b","#3a2118"],["#48516d","#242b3d"]];
      const sizes = [
        { w: 118, h: 188 },
        { w: 132, h: 208 },
        { w: 145, h: 225 },
        { w: 156, h: 238 },
        { w: 168, h: 252 }
      ];
      const [a,b] = palettes[seed % palettes.length];
      const size = sizes[(seed >>> 5) % sizes.length];
      const tiltOptions = [-2,-1,0,0,0,1,2];
      const tilt = tiltOptions[(seed >>> 12) % tiltOptions.length];
      return `--book-h:${size.h}px;--book-w:${size.w}px;--tilt:${tilt}deg;--book-a:${a};--book-b:${b}`;
    }

    function titleStyle(memory) {
      const title = String(memory.title || "Untitled memory").trim();
      const seed = hashString(memory.id || title || "memory");
      const width = [118,132,145,156,168][(seed >>> 5) % 5];
      const height = [176,194,212,230,248][(seed >>> 8) % 5];
      const areaScale = Math.sqrt((width * height) / (145 * 212));
      const words = title.split(/\s+/).filter(Boolean);
      const longestWord = Math.max(0, ...words.map(word => word.length));

      // Start large enough to use the cover. A runtime fitting pass reduces it only
      // when the complete title cannot fit without splitting a word.
      let size = 1.05 * areaScale;
      if (title.length < 24) size *= 1.16;
      else if (title.length > 58) size *= .91;
      if (longestWord > 15) size *= .92;
      size = Math.max(.62, Math.min(1.32, size));
      return `--title-size:${size.toFixed(3)}rem;--title-line:1.1`;
    }

    function renderBook(memory) {
      const style = `${bookStyle(memory)};${titleStyle(memory)}`;
      return `<button class="book-cover" type="button" data-memory-id="${escapeHtml(memory.id)}" style="${style}" title="${escapeHtml(memory.title || "Untitled memory")}" aria-label="Open ${escapeHtml(memory.title || "Untitled memory")}">
        <span class="book-cover-title">${escapeHtml(memory.title || "Untitled memory")}</span>
      </button>`;
    }

    function collectionBookStyle(book) {
      const base = bookStyle(book);
      if (book.sourceKey === "akailem") {
        return `${base};--book-h:225px;--book-w:145px`;
      }
      return base;
    }

    function akailemOrder(book) {
      if (book.sourceKey !== "akailem") return Number.POSITIVE_INFINITY;
      const match = String(book.title || "").match(/^Book\s+(\d+(?:\.\d+)?)/i);
      return match ? Number(match[1]) : Number.POSITIVE_INFINITY;
    }

    function sortCollectionBooks(items) {
      return items.map((book, index) => ({ book, index })).sort((a, b) => {
        const aAkailem = a.book.sourceKey === "akailem";
        const bAkailem = b.book.sourceKey === "akailem";
        if (aAkailem && bAkailem) {
          const orderDiff = akailemOrder(a.book) - akailemOrder(b.book);
          if (Number.isFinite(orderDiff) && orderDiff !== 0) return orderDiff;
          if (Number.isFinite(akailemOrder(a.book)) !== Number.isFinite(akailemOrder(b.book))) {
            return Number.isFinite(akailemOrder(a.book)) ? -1 : 1;
          }
          return String(a.book.title || "").localeCompare(String(b.book.title || ""), undefined, { numeric: true });
        }
        return a.index - b.index;
      }).map(entry => entry.book);
    }

    function renderCollectionBook(book) {
      const style = `${collectionBookStyle(book)};${titleStyle(book)}`;
      const title = book.title || "Untitled book";
      const attrs = book.kind === "external"
        ? `data-external-url="${escapeHtml(book.url || "")}"`
        : `data-book-source="${escapeHtml(book.sourceKey || "")}" data-book-page="${escapeHtml(book.pageId || "")}"`;
      return `<button class="book-cover collection-book" type="button" ${attrs} style="${style}" title="${escapeHtml(title)} — ${escapeHtml(book.source || "")}" aria-label="Open ${escapeHtml(title)}">
        <span class="book-cover-title">${escapeHtml(title)}</span>
        <span class="book-source">${escapeHtml(book.source || (book.kind === "external" ? "External" : "Notion"))}</span>
      </button>`;
    }

    function fitBookTitles(root = shelvesEl) {
      root.querySelectorAll(".book-cover-title").forEach(titleEl => {
        const book = titleEl.closest(".book-cover");
        if (!book) return;

        // Reset to the cover's preferred size before measuring, so larger books
        // can use their extra room instead of inheriting a previously reduced size.
        titleEl.style.fontSize = "var(--title-size, 1rem)";
        titleEl.style.lineHeight = "var(--title-line, 1.1)";

        let size = parseFloat(getComputedStyle(titleEl).fontSize);
        const minimum = 7.5;
        let attempts = 0;
        while ((titleEl.scrollHeight > titleEl.clientHeight + 1 || titleEl.scrollWidth > titleEl.clientWidth + 1) && size > minimum && attempts < 45) {
          size -= .5;
          titleEl.style.fontSize = `${size}px`;
          attempts++;
        }

        // Very long unbroken names remain whole. They may become small, but no
        // word is cut into vertical letter fragments.
        titleEl.classList.toggle("title-compact", size < 10);
      });
    }

    function getBookWidth(memory) {
      const seed = hashString(memory.id || memory.title || "memory");
      return [118,132,145,156,168][(seed >>> 5) % 5] + 16;
    }

    function getCollectionBookWidth(book) {
      return book.sourceKey === "akailem" ? 145 + 16 : getBookWidth(book);
    }

    function buildShelfRows(items) {
      if (!items.length) return ['<div class="shelf-row"><div class="empty-shelf">No memories match these filters.</div></div>'];
      const available = Math.max(280, shelvesEl.clientWidth - 60);
      const rows = [];
      let current = [];
      let used = 0;
      for (const memory of items) {
        const width = getBookWidth(memory);
        if (current.length && used + width > available) {
          rows.push(current);
          current = [];
          used = 0;
        }
        current.push(memory);
        used += width;
      }
      if (current.length) rows.push(current);
      return rows.map(row => `<div class="shelf-row">${row.map(renderBook).join("")}</div>`);
    }

    function buildBookShelfRows(items) {
      if (!items.length) return ['<div class="shelf-row"><div class="empty-shelf">No books match these filters.</div></div>'];
      const available = Math.max(280, bookShelvesEl.clientWidth - 60);
      const rows = [];
      let current = [];
      let used = 0;
      for (const book of items) {
        const width = getCollectionBookWidth(book);
        if (current.length && used + width > available) {
          rows.push(current);
          current = [];
          used = 0;
        }
        current.push(book);
        used += width;
      }
      if (current.length) rows.push(current);
      return rows.map(row => `<div class="shelf-row">${row.map(renderCollectionBook).join("")}</div>`);
    }

    function bookLabel(book) {
      return String(book.source || "Unlabelled").trim() || "Unlabelled";
    }

    function renderBookLabelFilters() {
      const labels = [];
      const seen = new Set();
      for (const book of books) {
        const label = bookLabel(book);
        const key = label.toLowerCase();
        if (!seen.has(key)) {
          seen.add(key);
          labels.push(label);
        }
      }

      if (selectedBookLabel !== "all" && !seen.has(selectedBookLabel)) selectedBookLabel = "all";
      bookLabelFilters.innerHTML = [
        `<button class="collection-btn ${selectedBookLabel === "all" ? "active" : ""}" type="button" data-book-label="all">All</button>`,
        ...labels.map(label => {
          const key = label.toLowerCase();
          return `<button class="collection-btn ${selectedBookLabel === key ? "active" : ""}" type="button" data-book-label="${escapeHtml(key)}">${escapeHtml(label)}</button>`;
        })
      ].join("");
    }

    function applyBookSearch() {
      const q = bookSearchInput.value.trim().toLowerCase();
      const filtered = sortCollectionBooks(books.filter(book => {
        const matchesLabel = selectedBookLabel === "all" || bookLabel(book).toLowerCase() === selectedBookLabel;
        const matchesSearch = !q || (book.title || "").toLowerCase().includes(q) || bookLabel(book).toLowerCase().includes(q);
        return matchesLabel && matchesSearch;
      }));
      bookShelvesEl.innerHTML = buildBookShelfRows(filtered).join("");
      requestAnimationFrame(() => fitBookTitles(bookShelvesEl));
      bookStatusEl.textContent = `${filtered.length} of ${books.length} books shown.`;
    }

    function getExternalBooks() {
      const configured = Array.isArray(window.EXTERNAL_BOOKS) ? window.EXTERNAL_BOOKS : [];
      return configured
        .filter(item => item && item.title && item.url)
        .map((item, index) => ({
          id: `external:${index}:${String(item.title)}`,
          kind: "external",
          title: String(item.title),
          source: String(item.label || "External"),
          url: String(item.url),
          lastEdited: null
        }));
    }

    async function loadBooks() {
      bookStatusEl.classList.remove("error");
      bookStatusEl.textContent = "Loading books…";
      bookRefreshBtn.disabled = true;
      try {
        const response = await fetch(BOOKS_API_ENDPOINT, { cache: "no-store" });
        if (!response.ok) throw new Error(`Request failed with ${response.status}`);
        const data = await response.json();
        const workerBooks = Array.isArray(data) ? data : data.books || [];
        books = [...workerBooks, ...getExternalBooks()];
        booksLoadedOnce = true;
        renderBookLabelFilters();
        applyBookSearch();
      } catch (error) {
        console.error(error);
        bookStatusEl.classList.add("error");
        bookStatusEl.textContent = `Could not load books: ${error.message}`;
        bookShelvesEl.innerHTML = '<div class="empty-shelf">The book collection is unavailable right now.</div>';
      } finally {
        bookRefreshBtn.disabled = false;
      }
    }

    async function loadBook(sourceKey, pageId) {
      const requestId = ++activeRequest;
      openReader();
      activeSeriesBook = null;
      readerBackBtn.textContent = "← Book Collection";
      notionLink.textContent = "Open in Notion ↗";
      notionLink.style.visibility = "hidden";
      readerScroll.innerHTML = '<div class="reader-loading">Opening book…</div>';
      try {
        const response = await fetch(`${BOOKS_API_ENDPOINT}/${encodeURIComponent(sourceKey)}/${encodeURIComponent(pageId)}`, { cache: "no-store" });
        if (!response.ok) {
          const payload = await response.json().catch(() => ({}));
          throw new Error(payload.detail || payload.error || `Request failed with ${response.status}`);
        }
        const data = await response.json();
        if (requestId !== activeRequest) return;
        if (Array.isArray(data.chapters)) {
          activeSeriesBook = { sourceKey, pageId, title: data.book?.title || "Book" };
          renderChapterList(data);
        } else {
          renderMemory(data);
        }
      } catch (error) {
        if (requestId !== activeRequest) return;
        console.error(error);
        readerScroll.innerHTML = `<div class="reader-loading" style="color:var(--danger)">Could not open this book.<br><small>${escapeHtml(error.message)}</small></div>`;
      }
    }

    function renderChapterList(data) {
      const book = data.book || {};
      notionLink.href = safeUrl(book.url || "#");
      notionLink.style.visibility = "visible";
      const chapters = data.chapters || [];
      const chapterHtml = chapters.length
        ? chapters.map(chapter => {
            const number = chapter.number == null ? "" : `Chapter ${chapter.number}`;
            const meta = [number, chapter.status].filter(Boolean).map(escapeHtml).join(" · ");
            return `<button class="chapter-button" type="button" data-akailem-chapter="${escapeHtml(chapter.id || "")}">
              <strong>${escapeHtml(chapter.title || "Untitled chapter")}</strong>
              ${meta ? `<span class="chapter-meta">${meta}</span>` : ""}
            </button>`;
          }).join("")
        : '<div class="empty-shelf">No chapters are available for this book yet.</div>';

      readerScroll.innerHTML = `
        <header class="page-head">
          <h1 class="page-title" id="readerTitle">${escapeHtml(book.title || "Untitled book")}</h1>
          <div class="page-meta">${escapeHtml(book.source || "Akailem")} · ${chapters.length} chapter${chapters.length === 1 ? "" : "s"}</div>
        </header>
        ${book.synopsis ? `<div class="book-synopsis">${escapeHtml(book.synopsis)}</div>` : ""}
        <div class="chapter-list">${chapterHtml}</div>`;
      readerScroll.scrollTop = 0;
    }

    async function loadAkailemChapter(chapterId) {
      const requestId = ++activeRequest;
      const series = activeSeriesBook;
      readerBackBtn.textContent = series ? `← ${series.title}` : "← Book Collection";
      notionLink.style.visibility = "hidden";
      readerScroll.innerHTML = '<div class="reader-loading">Opening chapter…</div>';
      try {
        const response = await fetch(`${BOOKS_API_ENDPOINT}/akailem/chapters/${encodeURIComponent(chapterId)}`, { cache: "no-store" });
        if (!response.ok) {
          const payload = await response.json().catch(() => ({}));
          throw new Error(payload.detail || payload.error || `Request failed with ${response.status}`);
        }
        const data = await response.json();
        if (requestId !== activeRequest) return;
        renderMemory(data);
        readerBackBtn.textContent = series ? `← ${series.title}` : "← Book Collection";
      } catch (error) {
        if (requestId !== activeRequest) return;
        console.error(error);
        readerScroll.innerHTML = `<div class="reader-loading" style="color:var(--danger)">Could not open this chapter.<br><small>${escapeHtml(error.message)}</small></div>`;
      }
    }

    function isRecent(memory) {
      const recentIds = new Set([...memories].sort((a,b) => new Date(b.lastEdited || 0) - new Date(a.lastEdited || 0)).slice(0, 15).map(m => m.id));
      return recentIds.has(memory.id);
    }

    function matchesCollection(memory) {
      if (selectedCollection === "all") return true;
      if (selectedCollection === "recent") return isRecent(memory);
      if (selectedCollection === "done") return statusKind(memory.status) === "done";
      return statusKind(memory.status) === "draft";
    }

    function matchesCharacters(memory) {
      if (!selectedCharacters.size) return true;
      const chars = new Set(Array.isArray(memory.characters) ? memory.characters : []);
      return [...selectedCharacters].every(character => chars.has(character));
    }

    function renderCharacterFilters() {
      const characters = [...new Set(memories.flatMap(memory => Array.isArray(memory.characters) ? memory.characters : []))]
        .filter(Boolean)
        .sort((a,b) => a.localeCompare(b));
      characterFilterPopover.innerHTML = characters.map(character => `
        <label class="filter-option"><input type="checkbox" value="${escapeHtml(character)}" ${selectedCharacters.has(character) ? "checked" : ""}> <span>${escapeHtml(character)}</span></label>`).join("") +
        '<button class="filter-clear" id="clearCharacterFilters" type="button">Clear character filters</button>';
      characterFilterCount.textContent = selectedCharacters.size ? String(selectedCharacters.size) : "All";
    }

    function applyFilters() {
      const q = searchInput.value.trim().toLowerCase();
      let filtered = memories.filter(memory => {
        const titleMatches = !q || (memory.title || "").toLowerCase().includes(q);
        return titleMatches && matchesCollection(memory) && matchesCharacters(memory);
      });
      filtered = stableShuffle(filtered);
      shelvesEl.innerHTML = buildShelfRows(filtered).join("");
      requestAnimationFrame(() => fitBookTitles());
      statusEl.textContent = `${filtered.length} of ${memories.length} memories shown.`;
    }


    async function loadMemories() {
      statusEl.classList.remove("error");
      statusEl.textContent = "Loading memories…";
      refreshBtn.disabled = true;

      try {
        const response = await fetch(API_ENDPOINT, { cache: "no-store" });
        if (!response.ok) throw new Error(`Request failed with ${response.status}`);
        const data = await response.json();
        memories = Array.isArray(data) ? data : data.memories || [];
        loadedOnce = true;
        renderCharacterFilters();
        applyFilters();
      } catch (error) {
        console.error(error);
        statusEl.classList.add("error");
        statusEl.textContent = `Could not load memories: ${error.message}`;
        shelvesEl.innerHTML = '<div class="empty-shelf">The archive is unavailable right now.</div>';
      } finally {
        refreshBtn.disabled = false;
      }
    }

    async function loadMemory(id) {
      activeSeriesBook = null;
      const requestId = ++activeRequest;
      openReader();
      readerBackBtn.textContent = "← Archive";
      notionLink.textContent = "Open in Notion ↗";
      notionLink.style.visibility = "hidden";
      readerScroll.innerHTML = '<div class="reader-loading">Opening memory…</div>';

      try {
        const response = await fetch(`${API_ENDPOINT}/${encodeURIComponent(id)}`, { cache: "no-store" });
        if (!response.ok) {
          const payload = await response.json().catch(() => ({}));
          throw new Error(payload.detail || payload.error || `Request failed with ${response.status}`);
        }
        const data = await response.json();
        if (requestId !== activeRequest) return;
        renderMemory(data);
      } catch (error) {
        if (requestId !== activeRequest) return;
        console.error(error);
        readerScroll.innerHTML = `<div class="reader-loading" style="color:var(--danger)">Could not open this memory.<br><small>${escapeHtml(error.message)}</small></div>`;
      }
    }

    function renderMemory(data) {
      const memory = data.memory || data.book || {};
      notionLink.href = safeUrl(memory.url || "#");
      notionLink.style.visibility = "visible";

      const icon = memory.icon?.type === "emoji"
        ? `<div class="page-icon">${escapeHtml(memory.icon.value)}</div>`
        : memory.icon?.type === "image"
          ? `<div class="page-icon"><img src="${escapeHtml(safeUrl(memory.icon.value))}" alt="" /></div>`
          : "";
      const cover = memory.cover?.url ? `<img class="cover" src="${escapeHtml(safeUrl(memory.cover.url))}" alt="" />` : "";
      const meta = [memory.source, memory.status, memory.date ? `Date: ${memory.date}` : "", memory.lastEdited ? `Updated ${new Date(memory.lastEdited).toLocaleString()}` : ""].filter(Boolean).map(escapeHtml).join(" · ");

      readerScroll.innerHTML = `
        ${cover}
        <header class="page-head">
          ${icon}
          <h1 class="page-title" id="readerTitle">${escapeHtml(memory.title || "Untitled memory")}</h1>
          <div class="page-meta">${meta}</div>
        </header>
        <div class="notion-content">${renderBlocks(data.blocks || [])}</div>
        ${data.truncated ? '<div class="truncate-note">This page was extremely large, so the reader stopped after its safety limit. Use “Open in Notion” for the remainder.</div>' : ""}`;
      readerScroll.scrollTop = 0;
    }

    function renderRichText(items = []) {
      return items.map(item => {
        let text = item.type === "equation" ? (item.equation || item.plainText || "") : (item.plainText || "");
        let html = escapeHtml(text).replace(/\n/g, "<br>");
        const a = item.annotations || {};
        if (a.code) html = `<code class="rt-code">${html}</code>`;
        if (a.bold) html = `<strong>${html}</strong>`;
        if (a.italic) html = `<em>${html}</em>`;
        if (a.strikethrough) html = `<s>${html}</s>`;
        if (a.underline) html = `<u>${html}</u>`;
        if (a.color && a.color !== "default") html = `<span class="rt-${escapeHtml(a.color)}">${html}</span>`;
        if (item.href) html = `<a href="${escapeHtml(safeUrl(item.href))}" target="_blank" rel="noopener noreferrer">${html}</a>`;
        return html;
      }).join("");
    }

    function renderBlocks(blocks = []) {
      let html = "";
      for (let i = 0; i < blocks.length; i++) {
        const block = blocks[i];
        if (block.type === "bulleted_list_item" || block.type === "numbered_list_item") {
          const type = block.type;
          const tag = type === "bulleted_list_item" ? "ul" : "ol";
          let items = "";
          while (i < blocks.length && blocks[i].type === type) {
            const current = blocks[i];
            items += `<li>${renderRichText(current.richText)}${current.children?.length ? renderBlocks(current.children) : ""}</li>`;
            i++;
          }
          i--;
          html += `<${tag}>${items}</${tag}>`;
          continue;
        }
        html += renderBlock(block);
      }
      return html;
    }

    function renderBlock(block) {
      const text = renderRichText(block.richText || []);
      const children = block.children?.length ? renderBlocks(block.children) : "";
      switch (block.type) {
        case "paragraph": return `<p>${text || "&nbsp;"}</p>${children}`;
        case "heading_1": return `<h1>${text}</h1>${children}`;
        case "heading_2": return `<h2>${text}</h2>${children}`;
        case "heading_3": return `<h3>${text}</h3>${children}`;
        case "quote": return `<blockquote>${text}${children}</blockquote>`;
        case "divider": return "<hr>";
        case "to_do": return `<div class="todo"><input type="checkbox" ${block.checked ? "checked" : ""} tabindex="-1"><div>${text}${children}</div></div>`;
        case "toggle": return `<details><summary>${text || "Toggle"}</summary>${children}</details>`;
        case "callout": return `<div class="callout"><div class="callout-icon">${renderIcon(block.icon)}</div><div>${text}${children}</div></div>`;
        case "code": return `<pre><code>${escapeHtml((block.richText || []).map(x => x.plainText || "").join(""))}</code></pre>${block.caption?.length ? `<div class="caption">${renderRichText(block.caption)}</div>` : ""}`;
        case "equation": return `<p class="equation">${escapeHtml(block.expression || "")}</p>`;
        case "image": return renderImage(block);
        case "video": return renderVideo(block);
        case "audio": return block.source?.url ? `<div class="media"><audio controls src="${escapeHtml(safeUrl(block.source.url))}"></audio>${renderCaption(block)}</div>` : "";
        case "file": case "pdf": return block.source?.url ? `<a class="bookmark" href="${escapeHtml(safeUrl(block.source.url))}" target="_blank" rel="noopener noreferrer">${escapeHtml(block.name || (block.type === "pdf" ? "Open PDF" : "Open file"))}</a>${renderCaption(block)}` : "";
        case "bookmark": case "embed": case "link_preview": return block.url ? `<a class="bookmark" href="${escapeHtml(safeUrl(block.url))}" target="_blank" rel="noopener noreferrer">${renderRichText(block.caption) || escapeHtml(block.url)}</a>` : "";
        case "table": return renderTable(block);
        case "table_row": return "";
        case "column_list": return `<div class="columns">${(block.children || []).map(child => `<div class="column">${renderBlocks(child.children || [])}</div>`).join("")}</div>`;
        case "column": return children;
        case "synced_block": return children;
        case "child_page": case "child_database": return `<div class="child-page">📄 ${escapeHtml(block.title || "Nested page")}</div>${children}`;
        case "table_of_contents": return '<div class="unsupported">Table of contents</div>';
        case "breadcrumb": return "";
        default: return children || `<div class="unsupported">Unsupported block: ${escapeHtml(block.rawLabel || block.type || "unknown")}</div>`;
      }
    }

    function renderIcon(icon) {
      if (!icon) return "💡";
      if (icon.type === "emoji") return escapeHtml(icon.value || "💡");
      if (icon.type === "image") return `<img src="${escapeHtml(safeUrl(icon.value))}" alt="" width="24" height="24">`;
      return "💡";
    }

    function renderCaption(block) {
      return block.caption?.length ? `<div class="caption">${renderRichText(block.caption)}</div>` : "";
    }

    function renderImage(block) {
      if (!block.source?.url) return "";
      return `<figure class="media"><img loading="lazy" src="${escapeHtml(safeUrl(block.source.url))}" alt="${escapeHtml((block.caption || []).map(x => x.plainText || "").join(" "))}">${renderCaption(block)}</figure>`;
    }

    function renderVideo(block) {
      if (!block.source?.url) return "";
      return `<div class="media"><video controls preload="metadata" src="${escapeHtml(safeUrl(block.source.url))}"></video>${renderCaption(block)}</div>`;
    }

    function renderTable(block) {
      const rows = (block.children || []).filter(child => child.type === "table_row");
      if (!rows.length) return "";
      const body = rows.map((row, rowIndex) => {
        const cellTag = block.hasColumnHeader && rowIndex === 0 ? "th" : "td";
        return `<tr>${(row.cells || []).map((cell, cellIndex) => {
          const tag = block.hasRowHeader && cellIndex === 0 ? "th" : cellTag;
          return `<${tag}>${renderRichText(cell)}</${tag}>`;
        }).join("")}</tr>`;
      }).join("");
      return `<div class="table-wrap"><table><tbody>${body}</tbody></table></div>`;
    }

    hotspot.addEventListener("click", openArchive);
    bookHotspot.addEventListener("click", openBookCollection);
    bookCloseBtn.addEventListener("click", closeBookCollection);
    bookRefreshBtn.addEventListener("click", loadBooks);
    bookSearchInput.addEventListener("input", applyBookSearch);
    bookLabelFilters.addEventListener("click", event => {
      const button = event.target.closest("[data-book-label]");
      if (!button) return;
      selectedBookLabel = button.dataset.bookLabel || "all";
      bookLabelFilters.querySelectorAll(".collection-btn").forEach(el => el.classList.toggle("active", el === button));
      applyBookSearch();
    });
    closeBtn.addEventListener("click", closeArchive);
    refreshBtn.addEventListener("click", loadMemories);
    searchInput.addEventListener("input", applyFilters);
    characterFilterToggle.addEventListener("click", () => {
      const open = !characterFilterPopover.classList.contains("open");
      characterFilterPopover.classList.toggle("open", open);
      characterFilterToggle.setAttribute("aria-expanded", String(open));
    });
    characterFilterPopover.addEventListener("change", event => {
      if (!event.target.matches('input[type="checkbox"]')) return;
      if (event.target.checked) selectedCharacters.add(event.target.value);
      else selectedCharacters.delete(event.target.value);
      characterFilterCount.textContent = selectedCharacters.size ? String(selectedCharacters.size) : "All";
      applyFilters();
    });
    characterFilterPopover.addEventListener("click", event => {
      if (event.target.id === "clearCharacterFilters") {
        selectedCharacters.clear();
        renderCharacterFilters();
        applyFilters();
      }
    });
    collectionFilters.addEventListener("click", event => {
      const button = event.target.closest("[data-collection]");
      if (!button) return;
      selectedCollection = button.dataset.collection;
      collectionFilters.querySelectorAll(".collection-btn").forEach(el => el.classList.toggle("active", el === button));
      applyFilters();
    });
    document.addEventListener("click", event => {
      if (!event.target.closest(".filter-group")) {
        characterFilterPopover.classList.remove("open");
        characterFilterToggle.setAttribute("aria-expanded", "false");
      }
    });
    let resizeTimer;
    window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (loadedOnce) applyFilters(); if (booksLoadedOnce) applyBookSearch(); }, 120); });
    shelvesEl.addEventListener("click", event => {
      const book = event.target.closest("[data-memory-id]");
      if (book) loadMemory(book.dataset.memoryId);
    });
    bookShelvesEl.addEventListener("click", event => {
      const external = event.target.closest("[data-external-url]");
      if (external) {
        const url = safeUrl(external.dataset.externalUrl || "");
        if (url !== "#") window.open(url, "_blank", "noopener,noreferrer");
        return;
      }
      const notionBook = event.target.closest("[data-book-source][data-book-page]");
      if (notionBook) loadBook(notionBook.dataset.bookSource, notionBook.dataset.bookPage);
    });
    readerCloseBtn.addEventListener("click", closeReader);
    readerScroll.addEventListener("click", event => {
      const chapter = event.target.closest("[data-akailem-chapter]");
      if (chapter) loadAkailemChapter(chapter.dataset.akailemChapter);
    });
    readerBackBtn.addEventListener("click", () => {
      if (activeSeriesBook && readerBackBtn.textContent !== "← Book Collection") {
        loadBook(activeSeriesBook.sourceKey, activeSeriesBook.pageId);
        return;
      }
      closeReader();
    });
    readerShell.addEventListener("click", event => { if (event.target === readerShell) closeReader(); });
    document.addEventListener("keydown", event => {
      if (event.key !== "Escape") return;
      if (readerShell.classList.contains("open")) closeReader();
      else if (bookShell.classList.contains("open")) closeBookCollection();
      else closeArchive();
    });
  </script>
</body>
</html>
