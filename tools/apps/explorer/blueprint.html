<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dorm Hallway Blueprint</title><style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101827;--line:#e63b53;--cyan:#9be7ff;--text:#f7f7fb;--muted:#aeb6c8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 30% 10%,#173759,#07111f 60%);font-family:Arial,sans-serif;color:var(--text);padding:24px}.wrap{max-width:1200px;margin:auto}.head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:16px}.head h1{margin:0}.head p{color:var(--muted);margin:6px 0 0}.stage{position:relative;aspect-ratio:100/68;background:#4f91bc;border:1px solid #ffffff33;box-shadow:0 20px 70px #0009;overflow:hidden}.room{position:absolute;background:#f9fdff;color:#101827;border:3px solid #36779e;display:grid;place-items:center;font-weight:900}.hall{position:absolute;background:#173759cc;border:2px dashed var(--cyan);display:grid;place-items:center;color:#fff;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.door{position:absolute;width:10px;height:10px;background:var(--line);border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);z-index:5}.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);margin-top:14px}.key{display:flex;align-items:center;gap:7px}.sw{width:18px;height:18px;border:2px solid #fff}.notes{background:#101827dd;border:1px solid #ffffff22;padding:16px;margin-top:18px}.notes li{margin:7px 0;color:var(--muted)}a{color:var(--cyan)}</style></head><body><div class="wrap"><div class="head"><div><h1>Dorm Floor → Hallway Blueprint</h1><p>Room rectangles copied from the original 2D map; blue corridor bands are the inferred walkable areas used by Three.js.</p></div><a href="index.html">Open 3D Explorer</a></div><div id="stage" class="stage"></div><div class="legend"><div class="key"><span class="sw" style="background:#f9fdff;border-color:#36779e"></span>Original room footprint</div><div class="key"><span class="sw" style="background:#173759;border-color:#9be7ff"></span>Generated hallway zone</div><div class="key"><span class="sw" style="width:12px;height:12px;border-radius:50%;background:#e63b53"></span>Door interaction point</div></div><div class="notes"><strong>Conversion assumptions</strong><ul id="notes"></ul></div></div><script type="module">const d=await fetch('./data/dorm-blueprint.json').then(r=>r.json());const s=document.querySelector('#stage');for(const h of d.hallways){const e=document.createElement('div');e.className='hall';Object.assign(e.style,{left:h.x+'%',top:(h.y/d.source.height*100)+'%',width:h.w+'%',height:(h.h/d.source.height*100)+'%'});e.textContent=h.name;s.append(e)}for(const r of d.rooms){const e=document.createElement('div');e.className='room';const q=r.source2D;Object.assign(e.style,{left:q.xPercent+'%',top:(q.yPercent/d.source.height*100)+'%',width:q.widthPercent+'%',height:(q.heightPercent/d.source.height*100)+'%'});e.textContent=r.name;s.append(e);const door=document.createElement('div');door.className='door';door.title=r.name+' door';const px=(r.door.x/d.units.metersPerMapPercent)+d.source.width/2;const py=(r.door.z/d.units.metersPerMapPercent)+d.source.height/2;Object.assign(door.style,{left:px+'%',top:(py/d.source.height*100)+'%'});s.append(door)}for(const n of d.conversionNotes){const li=document.createElement('li');li.textContent=n;notes.append(li)}</script></body></html>
